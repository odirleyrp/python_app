name: cicd

on:
  push:
    paths:
      - src/**
    branches:
      - main


jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Shorten Commit id
        shell: bash
        run: |
          echo "COMMIT_ID=${GITHUB_SHA::6}" >> "$GITHUB_ENV"
      -
        name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      -
        name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: odirleyrp/python-app:${{ env.COMMIT_ID }}
    outputs:
      commit_id: ${{ env.COMMIT_ID }}          
  cd:
    needs: ci
    runs-on: self-hosted
    steps:
      - uses: actions/checkou@v3

      - name: Modify Values file
        shell: bash
        run: |
          echo ${{needs.ci.outputs.commit_id}}
          pip3 install yq --break-system-packages
          yq -Yi '.image.tag = ${{needs.ci.outputs.commit_id}} chart/python-app/values.yaml'

      - name: Commit Chancges
        uses: EndBug/add-add-commit@v9
        with:
          message: "update do values ${{needs.ci.outputs.commit_id}} "


      - name: Install Argocd binary
        shell: bash
        run: |
          sudo curl -ksSL -o argocd  https://argocd-server.argocd/download/argocd-linux-amd64
          sudo chmod +x argocd
          sudo mv ./argocd /usr/local/bin

      - name: Argocd app sync
        shell: bash
        run: |
          argocd login argocd-server.argocd \
            --insecure \
            --grpc-web \
            --username admin \
            --password ${{ secrets.ARGOCD_PASSWORD }}
          argocd app sync python-app